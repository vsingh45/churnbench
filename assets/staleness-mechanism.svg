<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 452" width="720" height="452" role="img" aria-label="Cache age across a 29-day window. With refresh scheduling on, hot-tier age sawtooths between 0 and 2 days and warm-tier between 0 and 8 days, each bounded by its TTL, with refresh events marked as ticks below the axis. With scheduling off, age climbs linearly to 29 days. Endpoints: 4 versus 45 freshness errors.">
  <rect x="0" y="0" width="720" height="452" fill="#ffffff"/>

  <rect x="80" y="310" width="580" height="20" fill="#0c7a80" opacity="0.10"/>
  <rect x="80" y="250" width="580" height="80" fill="#0c7a80" opacity="0.05"/>

  <g stroke="#e9ecf0" stroke-width="1">
    <line x1="80" y1="330" x2="660" y2="330"/><line x1="80" y1="260" x2="660" y2="260"/>
    <line x1="80" y1="190" x2="660" y2="190"/><line x1="80" y1="120" x2="660" y2="120"/>
    <line x1="80" y1="50" x2="660" y2="50"/>
    <line x1="220" y1="40" x2="220" y2="330"/><line x1="360" y1="40" x2="360" y2="330"/>
    <line x1="500" y1="40" x2="500" y2="330"/>
  </g>

  <g stroke="#949cab" stroke-width="1.4">
    <line x1="80" y1="36" x2="80" y2="330"/><line x1="80" y1="330" x2="668" y2="330"/>
  </g>
  <line x1="660" y1="40" x2="660" y2="336" stroke="#949cab" stroke-width="1" stroke-dasharray="2 3"/>

  <g fill="#58616f" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10.5" text-anchor="end">
    <text x="70" y="334">0</text><text x="70" y="264">7</text><text x="70" y="194">14</text>
    <text x="70" y="124">21</text><text x="70" y="54">28</text>
  </g>
  <text x="26" y="185" fill="#58616f" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" text-anchor="middle" transform="rotate(-90 26 185)">cache age (days)</text>

  <g fill="#58616f" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10.5" text-anchor="middle">
    <text x="80" y="392">T'</text><text x="220" y="392">+7d</text><text x="360" y="392">+14d</text>
    <text x="500" y="392">+21d</text><text x="660" y="392">T</text>
  </g>

  <text x="72" y="352" fill="#949cab" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" text-anchor="end">hot</text>
  <g stroke="#0c7a80" stroke-width="1.6">
    <line x1="120" y1="345" x2="120" y2="353"/><line x1="160" y1="345" x2="160" y2="353"/>
    <line x1="200" y1="345" x2="200" y2="353"/><line x1="240" y1="345" x2="240" y2="353"/>
    <line x1="280" y1="345" x2="280" y2="353"/><line x1="320" y1="345" x2="320" y2="353"/>
    <line x1="360" y1="345" x2="360" y2="353"/><line x1="400" y1="345" x2="400" y2="353"/>
    <line x1="440" y1="345" x2="440" y2="353"/><line x1="480" y1="345" x2="480" y2="353"/>
    <line x1="520" y1="345" x2="520" y2="353"/><line x1="560" y1="345" x2="560" y2="353"/>
    <line x1="600" y1="345" x2="600" y2="353"/><line x1="640" y1="345" x2="640" y2="353"/>
  </g>
  <text x="72" y="368" fill="#949cab" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" text-anchor="end">warm</text>
  <g stroke="#0c7a80" stroke-width="1.6" opacity="0.75">
    <line x1="240" y1="361" x2="240" y2="369"/><line x1="400" y1="361" x2="400" y2="369"/>
    <line x1="560" y1="361" x2="560" y2="369"/>
  </g>
  <text x="668" y="352" fill="#949cab" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9">14 refreshes</text>
  <text x="668" y="368" fill="#949cab" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9">3 refreshes</text>

  <g stroke="#949cab" stroke-width="1" stroke-dasharray="3 4" opacity="0.85">
    <line x1="80" y1="320" x2="660" y2="320"/><line x1="80" y1="260" x2="660" y2="260"/>
