  <path d="M 80 330 L 660 40" fill="none" stroke="#a8551d" stroke-width="2.6" stroke-linecap="round"/>

  <polyline fill="none" stroke="#0c7a80" stroke-width="1.9" stroke-linejoin="round" stroke-dasharray="7 4"
    points="80,330 100,320 120,310 140,300 160,290 180,280 200,270 220,260 240,250 240,330 260,320 280,310 300,300 320,290 340,280 360,270 380,260 400,250 400,330 420,320 440,310 460,300 480,290 500,280 520,270 540,260 560,250 560,330 580,320 600,310 620,300 640,290 660,280"/>

  <polyline fill="none" stroke="#0c7a80" stroke-width="2.3" stroke-linejoin="round"
    points="80,330 100,320 120,310 120,330 140,320 160,310 160,330 180,320 200,310 200,330 220,320 240,310 240,330 260,320 280,310 280,330 300,320 320,310 320,330 340,320 360,310 360,330 380,320 400,310 400,330 420,320 440,310 440,330 460,320 480,310 480,330 500,320 520,310 520,330 540,320 560,310 560,330 580,320 600,310 600,330 620,320 640,310 640,330 660,320"/>

  <circle cx="660" cy="40" r="4.5" fill="#a8551d"/>
  <circle cx="660" cy="280" r="3.8" fill="#0c7a80"/>
  <circle cx="660" cy="320" r="3.8" fill="#0c7a80"/>
  <text x="650" y="34" fill="#a8551d" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11.5" font-weight="600" text-anchor="end">29d stale &#8594; 45 freshness errors</text>
  <text x="650" y="276" fill="#0c7a80" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10.5" text-anchor="end">warm 5d</text>
  <text x="650" y="316" fill="#0c7a80" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10.5" text-anchor="end">hot 1d &#8594; 4 freshness errors</text>
  <text x="666" y="264" fill="#949cab" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9">TTL 7</text>
  <text x="666" y="324" fill="#949cab" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9">TTL 1</text>

  <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11">
    <line x1="84" y1="424" x2="106" y2="424" stroke="#0c7a80" stroke-width="2.3"/>
    <text x="113" y="428" fill="#58616f">scheduling ON &#183; hot TTL 1</text>
    <line x1="272" y1="424" x2="294" y2="424" stroke="#0c7a80" stroke-width="1.9" stroke-dasharray="7 4"/>
    <text x="301" y="428" fill="#58616f">ON &#183; warm TTL 7</text>
    <line x1="440" y1="424" x2="462" y2="424" stroke="#a8551d" stroke-width="2.6"/>
    <text x="469" y="428" fill="#58616f">scheduling OFF (no_freshness_tiers)</text>
  </g>
</svg>
